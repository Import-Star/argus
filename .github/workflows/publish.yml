# Publishes the core extension to the VS Code Marketplace using Trusted Publishing (OIDC): no token is stored.
# Start it by hand from a release tag (Actions > Publish to Marketplace > Use workflow from: tag vX.Y.Z).
# The `marketplace` environment makes the repo owner approve each run and only lets `v*` tags use it.
name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only package the .vsix and upload it as a workflow artifact, do not publish
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # Only from a release tag, never from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: marketplace
    permissions:
      contents: read
      id-token: write # Trusted Publishing: vsce exchanges this OIDC token for a Marketplace token
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the next step can check the tag is on main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: a release build shouldn't restore caches other workflow runs saved.

      - name: Check the tag is a finished release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          if [ "$lock" != "$version" ]; then
            echo "package-lock.json version $lock does not match package.json version $version" >&2
            exit 1
          fi
          if ! grep -Fxq "## $version" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $version' heading" >&2
            exit 1
          fi
          # Marketplace versions can never be republished, so only ship commits that are on main.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Tag $TAG is not on main" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Check the packaged files include the plugin API
        run: |
          files="$(npx vsce ls --no-dependencies)"
          for f in api/index.d.ts api/webview.d.ts; do
            echo "$files" | grep -Fxq "$f" || { echo "Missing from package: $f" >&2; exit 1; }
          done

      - name: Package (dry run)
        if: env.DRY_RUN == 'true'
        run: npx vsce package --no-dependencies --out argus.vsix

      - name: Upload the .vsix (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argus-vsix
          path: argus.vsix
          if-no-files-found: error

      - name: Publish
        if: env.DRY_RUN != 'true'
        run: npx vsce publish --no-dependencies --oidc
