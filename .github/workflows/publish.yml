# Releases the core extension: publishes it to the VS Code Marketplace with Trusted Publishing (OIDC, no stored
# token), then tags the commit vX.Y.Z and creates a GitHub release with the .vsix attached.
# Start it by hand from main (Actions > Publish to Marketplace > Run workflow) after the release PR has merged.
# The `marketplace` environment makes the repo owner approve each run and only lets main use it.
name: Publish to Marketplace

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only build the .vsix and upload it as a workflow artifact. No publish, tag or GitHub release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # Only from main, never from another branch or a tag.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: marketplace
    permissions:
      contents: write # create the vX.Y.Z tag and the GitHub release
      id-token: write # Trusted Publishing: vsce exchanges this OIDC token for a Marketplace token
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, so the next step can find the last release
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: a release build shouldn't restore caches other workflow runs saved.

      # Before any work: the version must be new, and the release PR must be complete.
      - name: Check this is a new version
        run: |
          version="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          last="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          echo "package.json: $version, last release: ${last:-none}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released. Bump version in package.json (a release PR) first." >&2
            exit 1
          fi
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "${last#v}" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "package.json version $version is not higher than the last release $last." >&2
            exit 1
          fi
          if [ "$lock" != "$version" ]; then
            echo "package-lock.json version $lock does not match package.json version $version" >&2
            exit 1
          fi
          if ! grep -Fxq "## $version" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $version' heading" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX=argus-control-center-$version.vsix" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm test

      - name: Package
        run: npx vsce package --no-dependencies --out "$VSIX"

      - name: Check the package includes the plugin API
        run: |
          files="$(npx vsce ls --no-dependencies)"
          for f in api/index.d.ts api/webview.d.ts; do
            echo "$files" | grep -Fxq "$f" || { echo "Missing from package: $f" >&2; exit 1; }
          done

      - name: Upload the .vsix (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argus-vsix
          path: ${{ env.VSIX }}
          if-no-files-found: error

      # The Marketplace can never take the same version twice, so publish before tagging: a failed publish leaves no
      # tag behind and the run can simply be retried.
      - name: Publish to the Marketplace
        if: env.DRY_RUN != 'true'
        run: npx vsce publish --packagePath "$VSIX" --oidc

      - name: Tag vX.Y.Z and create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # This version's CHANGELOG section, without its heading, is the release notes.
          awk -v h="## $VERSION" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          # What's New images are paths in the repo; point them at this release's tag so the release page shows them.
          sed -i "s#](media/#](https://raw.githubusercontent.com/$REPO/v$VERSION/media/#g" notes.md
          # An annotated tag, like the ones made by hand before.
          tag_sha="$(gh api "repos/$REPO/git/tags" -f tag="v$VERSION" -f message="Argus $VERSION" -f object="$SHA" -f type=commit --jq .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag_sha" --silent
          gh release create "v$VERSION" "$VSIX" --repo "$REPO" --verify-tag --title "Argus $VERSION" --notes-file notes.md
