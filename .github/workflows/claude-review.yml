# Claude reviews a pull request against CLAUDE.md, only when the maintainer comments `/claude-review` on it.
# Who that is comes from the CLAUDE_REVIEWER repository variable (set in infra/github), so nobody else can start a
# review or spend the token. Needs the Claude GitHub App on this repo and the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude code review

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # A PR comment (not an issue comment) that starts with /claude-review, written by the maintainer.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude-review') &&
      vars.CLAUDE_REVIEWER != '' &&
      github.event.comment.user.login == vars.CLAUDE_REVIEWER
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # The default branch, not the PR's code: Claude reads the change through `gh pr diff`, and CLAUDE.md comes from
      # main so a PR can't rewrite the review rules for itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Review this pull request. Read CLAUDE.md first and check the change against its rules, in particular:
            - api/*.d.ts changes stay backwards compatible, or the version is bumped.
            - No hardcoded company, repo, user or path values.
            - Windows, macOS and Linux all work (path, os.homedir(), execFile with argument arrays).
            - Webview code keeps the strict CSP and escapes interpolated text with ctx.esc().
            - hooks/session-tracker.ts stays fast, synchronous, dependency-free, silent on stdout and never throws.
            - The Claude OAuth token is never logged, stored or sent anywhere.
            - README.md and CHANGELOG.md are updated when behaviour changes.

            The working directory is the default branch, not the PR. Use `gh pr diff` and `gh pr view` to read the change.
            Focus on correctness bugs, not style. Comment on specific lines with
            mcp__github_inline_comment__create_inline_comment (confirmed: true), then post one short summary with
            `gh pr comment`. If you find nothing, say so plainly. Keep it short.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
