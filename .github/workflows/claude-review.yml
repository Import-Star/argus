# Claude reviews each pull request against CLAUDE.md. Needs the Claude GitHub App on this repo and the
# CLAUDE_CODE_OAUTH_TOKEN secret. Fork PRs are skipped because GitHub gives them no secrets.
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first and check the change against its rules, in particular:
            - api/*.d.ts changes stay backwards compatible, or the version is bumped.
            - No hardcoded company, repo, user or path values.
            - Windows, macOS and Linux all work (path, os.homedir(), execFile with argument arrays).
            - Webview code keeps the strict CSP and escapes interpolated text with ctx.esc().
            - hooks/session-tracker.ts stays fast, synchronous, dependency-free, silent on stdout and never throws.
            - The user's local Claude OAuth token is never logged, stored or sent anywhere.
            - README.md and CHANGELOG.md are updated when behaviour changes.

            Focus on correctness bugs, not style. Use `gh pr diff` and `gh pr view` to read the change.
            Comment on specific lines with mcp__github_inline_comment__create_inline_comment (confirmed: true),
            then post one short summary with `gh pr comment`. If you find nothing, say so plainly. Keep it short.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
